<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>Redirecting…</title>
    <script type="text/javascript">
      // The site is a single page using hash routing (/#/section), so any
      // request GitHub Pages can't serve (e.g. /experience) is converted into
      // its hash-route equivalent and redirected back to the root document.
      // Note: this 404.html file must be at least 512 bytes for it to work
      // with Internet Explorer; the explanatory comments keep it above that.
      //
      // Examples:
      //   https://jaustinjr.com/experience  -> https://jaustinjr.com/#/experience
      //   https://jaustinjr.com/anything/x  -> https://jaustinjr.com/#/anything/x
      // Unknown segments simply render the page from the top, so this is
      // always safe.
      var l = window.location;
      var path = l.pathname.replace(/^\/+|\/+$/g, "");
      l.replace(
        l.protocol + "//" + l.hostname + (l.port ? ":" + l.port : "") +
        "/#/" + path + l.search + (l.hash ? l.hash.replace("#", "") : "")
      );
    </script>
  </head>
  <body>
  </body>
</html>
